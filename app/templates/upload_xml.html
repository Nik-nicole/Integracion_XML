<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar archivo XML</title>
</head>
<body>
    <h2>Cargar archivo XML</h2>
    <form action="{{ url_for('xml_upload.upload_xml') }}" method="POST" enctype="multipart/form-data">
        <label for="xml_file">Selecciona un archivo XML:</label>
        <input type="file" name="xml_file" id="xml_file" accept=".xml" required>
        <br><br>
        <button type="submit">Cargar XML</button>
    </form>
</body>
</html>
